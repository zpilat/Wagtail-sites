{% load navigation_tags %}

<div class="site-footer__inner">
    <div>
        <p class="site-footer__brand">Pilátovic famílie</p>
        <p class="site-footer__note">Osobní zápisky, recepty, programování a cesty.</p>
        {% get_footer_text %}
    </div>
    {% with github_url=settings.base.NavigationSettings.github_url %}
        {% if github_url %}
            <a class="site-footer__link" href="{{ github_url }}">
                <i class="fa-brands fa-github" aria-hidden="true"></i>
                Další projekty na GitHubu
            </a>
        {% endif %}
    {% endwith %}
</div>
<p class="site-footer__framework">Vytvořeno ve frameworku Wagtail</p>
