<figure class="roadtrip-media my-4 text-center">
    <video controls
           preload="metadata"
           class="w-100 rounded-4"
           width="{% if is_roadtrip_day %}1024{% else %}1200{% endif %}">
        <source src="{{ value.video.url }}">
        Váš prohlížeč nepodporuje přehrávání videa.
    </video>
    {% if value.caption %}
        <figcaption class="text-muted small mt-1">{{ value.caption }}</figcaption>
    {% endif %}
</figure>
