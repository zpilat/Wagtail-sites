{% load wagtailimages_tags %}

{% if image %}
    <section class="media-surface"
             {% if heading %}aria-labelledby="{{ heading_id }}"{% else %}aria-label="Titulní fotografie – {{ alt_text }}"{% endif %}>
        {% if heading %}
            <h2 id="{{ heading_id }}" class="h4 text-center mb-3">{{ heading }}</h2>
        {% endif %}

        {% if is_roadtrip_day %}
            {% image image width-1024 as hero_image %}
        {% else %}
            {% image image width-1200 as hero_image %}
        {% endif %}
        <img src="{{ hero_image.url }}"
             alt="{{ heading|default:alt_text }}"
             class="img-fluid d-block mx-auto w-100"
             width="{% if is_roadtrip_day %}1024{% else %}1200{% endif %}"
             loading="lazy">
    </section>
{% endif %}
