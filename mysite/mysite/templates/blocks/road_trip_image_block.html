{% load wagtailimages_tags %}

<figure class="roadtrip-media my-4 text-center">
    {% image value.image width-1024 as image %}
    <img src="{{ image.url }}"
         alt="{{ value.caption|default:'Fotografie z autovandru' }}"
         class="img-fluid d-block w-100 rounded-4"
         width="1024"
         loading="lazy">
    {% if value.caption or value.attribution %}
        <figcaption class="text-muted small mt-1">
            {{ value.caption }}{% if value.caption and value.attribution %} – {% endif %}{{ value.attribution }}
        </figcaption>
    {% endif %}
</figure>
