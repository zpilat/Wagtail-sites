<figure class="roadtrip-media my-4 text-center">
    <a href="{{ value.mapy_url }}"
       class="d-block w-100"
       target="_blank"
       rel="noopener noreferrer">
        <img src="{{ value.image_url }}"
             alt="{{ value.caption|default:'Fotografie z Mapy.com' }}"
             class="img-fluid d-block w-100 rounded-4"
             width="{% if is_roadtrip_day %}1024{% else %}1200{% endif %}"
             loading="lazy">
    </a>

    {% if value.caption %}
        <figcaption class="text-muted small mt-1">
            {{ value.caption }} – Foto autorů na&nbsp;
            <a href="{{ value.mapy_url }}"
               target="_blank"
               rel="noopener noreferrer">Mapy.com</a>
        </figcaption>
    {% endif %}
</figure>
