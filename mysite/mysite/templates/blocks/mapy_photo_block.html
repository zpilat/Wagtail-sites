<figure class="my-4 text-center">
    <a href="{{ value.mapy_url }}"
       target="_blank"
       rel="noopener noreferrer">
        <img src="{{ value.image_url }}"
             alt="{{ value.caption|default:'Fotografie z Mapy.com' }}"
             class="img-fluid rounded"
             loading="lazy">
    </a>

    {% if value.caption %}
        <figcaption class="text-muted small mt-1">
            {{ value.caption }} –
            <a href="{{ value.mapy_url }}"
               target="_blank"
               rel="noopener noreferrer">Autoři na Mapy.com</a>
        </figcaption>
    {% endif %}
</figure>
