{% if mapy_url %}
    <section class="map-surface"
             aria-labelledby="mapy-route-heading">
        <h2 id="mapy-route-heading" class="h4 text-center mb-3">Mapa trasy</h2>
        <div class="ratio mx-auto" style="--bs-aspect-ratio: 64%;">
            <iframe src="{{ mapy_url }}"
                    title="Mapa trasy – {{ map_title }}"
                    {% if is_roadtrip_day %}width="1024" height="655"{% else %}width="1200" height="768"{% endif %}
                    style="border: 0;"
                    frameborder="0"
                    loading="lazy"></iframe>
        </div>
    </section>
{% endif %}
