{% if mapy_url %}

         style="--bs-aspect-ratio: 64%; max-width: 1200px;">
        <iframe src="{{ mapy_url }}"
                title="Mapa trasy – {{ map_title }}"
                width="1200"
                height="768"
                style="border: none;"
                frameborder="0"
                loading="lazy"></iframe>
    </div>
{% endif %}
