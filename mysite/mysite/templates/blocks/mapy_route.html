{% if mapy_url %}
    <section class="map-surface{% if not is_roadtrip_day %} map-surface--square{% endif %}"
             aria-labelledby="mapy-route-heading">
        <h2 id="mapy-route-heading" class="h4 text-center mb-3">Mapa trasy</h2>
        <div class="ratio mx-auto"
             style="--bs-aspect-ratio: {% if is_roadtrip_day %}75%{% else %}100%{% endif %}">
            <iframe src="{{ mapy_url }}"
                    title="Mapa trasy – {{ map_title }}"
                    {% if is_roadtrip_day %}width="1024" height="768"{% else %}width="1024" height="1024"{% endif %}
                    style="border: 0;"
                    frameborder="0"
                    loading="lazy"></iframe>
        </div>
    </section>
{% endif %}
