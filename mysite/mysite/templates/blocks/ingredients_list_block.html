{% load wagtailcore_tags %}

{% if value.title %}
    <h3 class="h4 mt-4">{{ value.title }}</h3>
{% endif %}

{% with ingredients=value.ingredients_list %}
<ul class="ingredients-list">
    {% for ingredient in ingredients %}
        <li>{{ ingredient|richtext }}</li>
    {% endfor %}
</ul>
{% endwith %}
