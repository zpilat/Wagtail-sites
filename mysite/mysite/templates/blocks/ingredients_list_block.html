{% load wagtailcore_tags %}

{% if value.title %}
    <div class="row mt-4">
        <div class="col">
            <p class="h4">{{ value.title }}</p>
        </div>
    </div>    
{% endif %}

{% with ingredients=value.ingredients_list %}
<ol>
    {% for ingredient in ingredients %}
        <li class="px-2">{{ ingredient|richtext }}</li>
    {% endfor %}
</ol>
{% endwith %}
