{% load wagtailcore_tags wagtailimages_tags %}


<div class="row">
    <div class="col">
        <p class="h1 my-4">{{ page.title }}</p>
        {% if page.date_published %}
            <p class="text-muted">{{ page.date_published }}</p>
        {% endif %}            
        {% if page.subtitle %}
            <p class="h4 text-muted">{{ page.subtitle }}</p>
        {% endif %}
    </div>
</div>
<div class="row mt-4">
    <div class="col">
        <p class="h3">Úvod</p>
        <p>{{ page.introduction }}</p>
    </div>
</div>
